name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -v

  cli-smoke-test:
    name: CLI exit-code contract
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e .
      - name: good_app must pass (exit 0, no findings)
        run: ai-quality-analyzer scan ./examples/good_app
      - name: bad_app must fail (exit 1, findings present)
        run: |
          if ai-quality-analyzer scan ./examples/bad_app; then
            echo "::error::Expected examples/bad_app to fail the scan, but it passed." >&2
            exit 1
          fi
